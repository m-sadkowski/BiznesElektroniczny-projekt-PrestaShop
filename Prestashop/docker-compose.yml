version: '3.8'

services:
  db:
    image: mariadb:10.5
    container_name: prestashop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop_user
      MYSQL_PASSWORD: user123
    volumes:
      - db_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:1.7.8
    container_name: prestashop_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop_user
      DB_PASS: user_password_123
      PS_INSTALL_AUTO: 0
      PS_DOMAIN: "localhost:8080"
    volumes:
      - ps_data:/var/www/html
      - ./src/themes/betheme:/var/www/html/themes/betheme
      - ./src/modules/bemodule:/var/www/html/modules/bemodule

volumes:
  db_data:
  ps_data: